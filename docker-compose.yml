# The container listens on loopback only; whatever proxy or tunnel you put in front of it
# terminates TLS. Change the published port to suit the host.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3458:80"
    volumes:
      # Usage statistics outlive a rebuild; nothing in here identifies anyone.
      - ./logs:/var/log/nginx
      # Dashboard data the partner publishes (bundles + dashboards.json). Customer data:
      # never in the image, never in git; the folder is created empty if it is missing.
      - ./published:/usr/share/nginx/html/published:ro
    healthcheck:
      # localhost resolves to ::1 first inside the container and nginx listens on
      # IPv4 only, which fails as "connection refused" while the service is fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
