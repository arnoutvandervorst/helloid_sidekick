<!doctype html>
<html lang="en" data-theme="dark">
<head>

<title>HelloID Sidekick</title>

<body>

<div id="drop-veil" hidden><div id="drop-veil-text"></div></div>

<header class="topbar">
  <div class="brand">
    <span class="mark-host"></span>
    <div>
      <strong id="topbar-title">HelloID Sidekick</strong>
      <span class="sub" id="topbar-sub"></span>
    </div>
  </div>
  <div class="topbar-actions">
    <select id="workspace-select" title="Workspace"></select>
    <button class="btn primary" id="btn-import">
      <span id="btn-import-label">Import</span>
    </button>
    <a class="btn ghost" id="link-repo" href="https://github.com/arnoutvandervorst/helloid_sidekick"
       target="_blank" rel="noopener noreferrer">GitHub</a>
    <select id="lang-select" title="Language"></select>
    <button class="btn ghost" id="btn-theme" title="Toggle light/dark">◐</button>
  </div>
</header>

<div id="demo-host"></div>

<div class="shell">
  <nav class="sidenav" id="sidenav"></nav>
  <main id="view-root">

  </main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <div id="drawer-title"></div>
    <button class="btn ghost" id="drawer-close">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>
<div id="drawer-scrim" hidden></div>
<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>
