# Log formats that cannot identify a visitor: no $remote_addr, no $http_user_agent,
# no $http_referer, no cookie. What is left answers "what is being used" and nothing else.
log_format anon '$time_iso8601 $status $request_method $uri';
log_format usage '$time_iso8601 $args';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anon;

    # Everything is served from this origin: no CDN, no third-party script, no network
    # call out of the page. The policy states that rather than trusting it.
    # 'unsafe-eval' is the one concession: the field-mapping simulation runs the
    # Complex mappings from the customer's own HelloID export, which are JavaScript
    # (js/fieldmap.js compiles them with new Function). Without it the simulation
    # dies with "Evaluating a string as JavaScript violates ... script-src".
    #
    # These sit at server level and are NOT repeated in the location blocks below,
    # because add_header does not inherit into a block that declares its own — a child
    # add_header silently drops every header set here.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The analysis runs in the browser, so a stale script is a stale product.
    add_header Cache-Control "no-cache" always;

    # Anonymous usage statistics. The page posts an event name and a coarse bucket here;
    # the server records the query string and nothing about who sent it.
    location = /u {
        access_log /var/log/nginx/usage.log usage;
        return 204;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ stops regex matching, so the branding files below are served rather than caught
    # by the export block.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The published demo set is fiction generated by make-demo-set.py, and the only
    # CSV/JSON this server is ever allowed to hand out. ^~ wins over the regex below.
    # The demo set is regenerated whenever the generator changes, and a visitor holding
    # last hour's files with this hour's manifest sees a version that never existed.
    # It is a megabyte, fetched once per session: revalidating costs nothing worth having.
    location ^~ /demo/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Published dashboard data: bundles the partner puts in ./published on the host
    # (mounted read-only into the image) and the dashboards.json that names them. A
    # dashboard fetches its bundle on open and compares the stamp, so never cache it.
    # This is customer data; who may reach the hostname is the proxy's business.
    location ^~ /published/ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # A dashboard's own URL: /d/<id> serves the app, and the relative assets and fetches
    # the page then makes (js/, css/, assets/, demo/, published/, docs/) are rewritten
    # back to the root. No add_header here: the CSP above must reach index.html.
    location ^~ /d/ {
        rewrite ^/d/(?:[a-z0-9-]+/)?(js|css|assets|demo|published|docs)/(.*)$ /$1/$2 last;
        rewrite ^/d/[a-z0-9-]+/?$ /index.html last;
        return 404;
    }

    # No export should ever be reachable from the web, even if one is copied in by mistake.
    location ~* \.(csv|json)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
