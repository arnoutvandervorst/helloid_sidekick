# Log formats that cannot identify a visitor: no $remote_addr, no $http_user_agent,
# no $http_referer, no cookie. What is left answers "what is being used" and nothing else.
log_format anon '$time_iso8601 $status $request_method $uri';
# The beacon's query string is caller-controlled: only the known keys, with a plain
# value, reach the log; anything else is written as empty.
map $arg_e    $u_e    { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_e;    default ""; }
map $arg_v    $u_v    { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_v;    default ""; }
map $arg_a    $u_a    { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_a;    default ""; }
map $arg_kind $u_kind { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_kind; default ""; }
map $arg_size $u_size { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_size; default ""; }
map $arg_lang $u_lang { "~^[A-Za-z0-9%:._+-]{1,64}$" $arg_lang; default ""; }
log_format usage '$time_iso8601 e=$u_e&v=$u_v&a=$u_a&kind=$u_kind&size=$u_size&lang=$u_lang';
# Behind the proxy every request shares one address, so this is in effect a global cap.
limit_req_zone $binary_remote_addr zone=usage:1m rate=10r/s;

server {
    # nginx-unprivileged runs as uid 101 and cannot bind below 1024.
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anon;

    # Everything is served from this origin: no CDN, no third-party script, no network
    # call out of the page. The policy states that rather than trusting it.
    # 'unsafe-eval' is the one concession: the field-mapping simulation runs the
    # Complex mappings from the customer's own HelloID export, which are JavaScript
    # (js/fieldmap.js compiles them with new Function inside a sandboxed srcdoc iframe
    # with an opaque origin; the srcdoc inherits this policy, so it still needs the
    # eval). The sha256 is that iframe's inline script: it changes whenever
    # sandboxMain in js/fieldmap.js changes; keep it equal to the index.html meta CSP.
    #
    # add_header does not inherit into a block that declares its own — a child
    # add_header silently drops every header set here. /demo/ and /published/ set their
    # own Cache-Control, so they repeat this whole set: change one, change all three.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'sha256-hNT8beoJeoldc3gfjhhv24Gj7hNfpmbHtzJruq1Eqp8='; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The analysis runs in the browser, so a stale script is a stale product.
    add_header Cache-Control "no-cache" always;

    # Anonymous usage statistics. The page posts an event name and a coarse bucket here;
    # the server records the query string and nothing about who sent it.
    location = /u {
        access_log /var/log/nginx/usage.log usage;
        limit_req zone=usage burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        # not `return 204`: return runs in the rewrite phase, before limit_req ever sees the request
        try_files /.usage-beacon =204;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ stops regex matching, so the branding files below are served rather than caught
    # by the export block.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The published demo set is fiction generated by make-demo-set.py, and the only
    # CSV/JSON this server is ever allowed to hand out. ^~ wins over the regex below.
    # The demo set is regenerated whenever the generator changes, and a visitor holding
    # last hour's files with this hour's manifest sees a version that never existed.
    # It is a megabyte, fetched once per session: revalidating costs nothing worth having.
    location ^~ /demo/ {
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'sha256-hNT8beoJeoldc3gfjhhv24Gj7hNfpmbHtzJruq1Eqp8='; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # Published dashboard data: bundles the partner puts in ./published on the host
    # (mounted read-only into the image) and the dashboards.json that names them. A
    # dashboard fetches its bundle on open and compares the stamp, so never cache it.
    # This is customer data; who may reach the hostname is the proxy's business.
    location ^~ /published/ {
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'sha256-hNT8beoJeoldc3gfjhhv24Gj7hNfpmbHtzJruq1Eqp8='; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store" always;
    }

    # A dashboard's own URL: /d/<id> serves the app, and the relative assets and fetches
    # the page then makes (js/, css/, assets/, demo/, published/, docs/) are rewritten
    # back to the root. No add_header here: the CSP above must reach index.html.
    location ^~ /d/ {
        rewrite ^/d/(?:[a-z0-9-]+/)?(js|css|assets|demo|published|docs)/(.*)$ /$1/$2 last;
        rewrite ^/d/[a-z0-9-]+/?$ /index.html last;
        return 404;
    }

    # No export should ever be reachable from the web, even if one is copied in by mistake.
    location ~* \.(csv|json)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
